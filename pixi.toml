# Environment for PartCATSeg. ALWAYS `source ./pixi_setup.sh` before running pixi (keeps the
# package cache off the full root filesystem), then `pixi install`.
#
# Versions follow the README (Python 3.8, torch 2.2.2 + CUDA 12.1). Deviations:
#   * torch comes from the conda `pytorch` channel rather than the PyPI cu121 wheel, so it is a
#     conda package that detectron2 can be compiled against without build isolation.
#   * mmsegmentation is omitted (never imported) and mmcv-full is replaced by the ops-free `mmcv`
#     (only `mmcv.utils.track_parallel_progress` is used, by mask_cls_collect.py).
#   * open_clip_torch is deliberately NOT installed, matching the README. With it installed,
#     `import open_clip` pulls in the repo's stripped-down vendored `transformers/`, which raises
#     RuntimeError (not ImportError) and crashes. Without it, `import open_clip` resolves to the
#     repo's `open_clip/` dir as an empty namespace package, which is all the ViT-B/16 configs need.
#     Consequence: CLIP_PRETRAINED "ViT-H" / "ViT-G" do not work (same as upstream).

[workspace]
name = "part-catseg"
channels = ["pytorch", "nvidia", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.8.*"
pip = "*"
pytorch = { version = "==2.2.2", build = "*cuda12.1*" }
torchvision = "==0.17.2"
# README pins Pillow~=9.5 (i.e. stay below 10, which removed APIs detectron2 uses). The conda-forge
# 9.5 build is unsolvable under strict channel priority, so take the pytorch channel's 9.4.
pillow = "<10"
pytorch-cuda = "12.1.*"
# pytorch-channel builds fail to import with mkl >= 2024.1 (undefined symbol iJIT_NotifyEvent)
mkl = "2023.*"
blas = { version = "*", build = "mkl" }
numpy = "1.23.*"
setuptools = "<70"
ninja = "*"
# CUDA 12.1 toolkit: only needed to compile detectron2's CUDA extension (no system nvcc here)
cuda-nvcc = "12.1.*"
cuda-cudart-dev = "12.1.*"
cuda-cccl = "12.1.*"
cuda-libraries-dev = "12.1.*"

[pypi-dependencies]
timm = "==0.9.1"
scikit-image = "==0.21.0"
scikit-learn = "==0.24.2"
opencv-python = "==4.5.5.64"
hydra-core = "==1.3.2"
tokenizers = "==0.11.1"
mmcv = "==1.7.2"
einops = "*"
ftfy = "*"
regex = "*"
fire = "*"
psutil = "*"
gdown = "*"
detectron2 = { git = "https://github.com/facebookresearch/detectron2.git", rev = "1e3e13bbf607b54f62205c4c33922521822fb298" }

[pypi-options]
no-build-isolation = ["detectron2", "mmcv"]

[tasks]
# DINOv2's current main needs Python >= 3.10; pin the torch.hub cache to the release-era commit
fetch-dinov2 = "python fetch_dinov2.py"

[activation.env]
CUDA_HOME = "$CONDA_PREFIX"
FORCE_CUDA = "1"
TORCH_CUDA_ARCH_LIST = "8.9"   # RTX 4090
DETECTRON2_DATASETS = "/scratch2/ennovatex.Soumo/part_datasets"   # PascalPart116, ADE20KPart234, PACO_tabletop, ...
# runtime caches -> project dir instead of ~/.cache
XDG_CACHE_HOME = "$PIXI_PROJECT_ROOT/.cache"
TORCH_HOME = "$PIXI_PROJECT_ROOT/.cache/torch"
HF_HOME = "$PIXI_PROJECT_ROOT/.cache/huggingface"
CLIP_CACHE_DIR = "$PIXI_PROJECT_ROOT/.cache/clip"
MPLCONFIGDIR = "$PIXI_PROJECT_ROOT/.cache/matplotlib"
TMPDIR = "$PIXI_PROJECT_ROOT/.tmp"
PYTHONNOUSERSITE = "1"
